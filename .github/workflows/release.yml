name: Package release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to
        required: true
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Verify release target
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Housekeeping/Info.plist)
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | /usr/bin/grep -qx true
      - name: Restore verified housekeeper and arm64 media inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          gh release download v0.26.8 --pattern Housekeeping-macOS-universal.zip --dir "$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/base"
          echo '7eb6b3bd6662165f4c79d8a6f59af0161e8afb4f9c2ef88861dcfb7553c7d827  Housekeeping-macOS-universal.zip' | shasum -a 256 -c -
          ditto -x -k Housekeeping-macOS-universal.zip .
          codesign --verify --deep --strict Housekeeping.app
          cp Housekeeping.app/Contents/Resources/llama-server "$GITHUB_WORKSPACE/Housekeeping/Resources/llama-server"
      - name: Build complete universal Bookbind runtime from versioned source
        env:
          HOUSEKEEPING_MEDIA_ARM64_BIN: ${{ runner.temp }}/base/Housekeeping.app/Contents/Resources/Bookbind/bin
        run: bash script/build_bookbind_runtime.sh
      - name: Run safety and local fake-MCP tests
        run: |
          bash script/test_safety.sh
          python3 script/test_background_mcp.py
      - name: Compile and package the complete universal app
        run: bash script/package_release.sh "$RUNNER_TEMP/dist"
      - name: Verify packages and create checksums
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/check"
          ditto -x -k "$RUNNER_TEMP/dist/Housekeeping-macOS-universal.zip" "$RUNNER_TEMP/check"
          app="$RUNNER_TEMP/check/Housekeeping.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :HousekeepingSourceCommit' "$app/Contents/Info.plist")" = "$(git rev-parse HEAD)"
          python3 script/verify_universal_bundle.py "$app"
          python3 script/bookbind_runtime_manifest.py verify Runtime/Bookbind "$app/Contents/Resources/Bookbind/bin/runtime-manifest.json"
          cmp Runtime/Bookbind/app.py "$app/Contents/Resources/Bookbind/app.py"
          cmp Runtime/Bookbind/bookbind_cli.py "$app/Contents/Resources/Bookbind/bookbind_cli.py"
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 Housekeeping-macOS-*.zip > SHA256SUMS.txt
      - name: Attach verified downloads to draft release
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/dist/Housekeeping-macOS-universal.zip" "$RUNNER_TEMP/dist/SHA256SUMS.txt"
